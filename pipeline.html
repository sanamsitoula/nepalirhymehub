<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nepali Rhyme Hub Review</title>
<style>
:root{
  --bg:#f6f2ea;--panel:#fffdf8;--ink:#1d2340;--muted:#6b6f85;--line:#e4dccb;
  --blue:#1f3a8a;--blue-soft:#e6ebfa;--gold:#b8860b;--gold-soft:#fbf1d6;--saffron:#e07b1a;
  --ok:#1f7a4d;--ok-soft:#e3f4ea;--warn:#a86400;--warn-soft:#fdf0d8;--bad:#b42318;--bad-soft:#fde8e6;
  --idle:#5b6170;--idle-soft:#eceef2;--shadow:0 1px 2px rgba(30,30,60,.06),0 4px 14px rgba(30,30,60,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12141c;--panel:#1a1d28;--ink:#e9e7f2;--muted:#9aa0b5;--line:#2c3142;
  --blue:#8fa8ff;--blue-soft:#222b4a;--gold:#e0b44a;--gold-soft:#3a3120;--saffron:#f39a4a;
  --ok:#5fd39a;--ok-soft:#183427;--warn:#f0b35a;--warn-soft:#3a2d17;--bad:#ff8a80;--bad-soft:#3d1d1b;
  --idle:#a3a9bb;--idle-soft:#262a37;--shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);}}
:root[data-theme="dark"]{
  --bg:#12141c;--panel:#1a1d28;--ink:#e9e7f2;--muted:#9aa0b5;--line:#2c3142;
  --blue:#8fa8ff;--blue-soft:#222b4a;--gold:#e0b44a;--gold-soft:#3a3120;--saffron:#f39a4a;
  --ok:#5fd39a;--ok-soft:#183427;--warn:#f0b35a;--warn-soft:#3a2d17;--bad:#ff8a80;--bad-soft:#3d1d1b;
  --idle:#a3a9bb;--idle-soft:#262a37;--shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI","Noto Sans Devanagari",sans-serif}
button,select,input,textarea{font:inherit;color:inherit}
header.top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
header.top h1{font-size:17px;margin:0;font-weight:650}
header.top h1 span{color:var(--gold)}
header.top .sp{flex:1}
.layout{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 52px)}
aside{border-right:1px solid var(--line);background:var(--panel);padding:12px;position:sticky;top:52px;height:calc(100vh - 52px);overflow:auto}
aside input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chipbtn{border:1px solid var(--line);background:transparent;border-radius:999px;padding:2px 10px;font-size:12.5px;cursor:pointer}
.chipbtn.on{background:var(--blue);border-color:var(--blue);color:#fff}
.score10-tag{display:inline-block;font-size:10.5px;font-weight:750;padding:1px 6px;border-radius:999px;background:var(--gold-soft);color:var(--gold);border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);margin-left:5px;vertical-align:middle;line-height:1.2}
.song{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:transparent;padding:7px 8px;border-radius:8px;cursor:pointer}
.song:hover{background:var(--blue-soft)}
.song.sel{background:var(--blue-soft);outline:1px solid var(--blue)}
.song .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--idle)}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
main{padding:16px 22px 80px;min-width:0}
.empty{color:var(--muted);padding:40px;text-align:center}
.gate{border-radius:12px;padding:12px 16px;margin:10px 0 14px;display:flex;gap:12px;align-items:flex-start}
.gate.closed{background:var(--bad-soft);border:1px solid color-mix(in srgb,var(--bad) 35%,transparent)}
.gate.open{background:var(--ok-soft);border:1px solid color-mix(in srgb,var(--ok) 35%,transparent)}
.gate b{display:block;font-size:15.5px}
.gate details{margin-top:4px;font-size:13px;color:var(--muted)}
.songhead{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.songhead h2{margin:0;font-size:22px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:550}
.btn:hover{border-color:var(--blue)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.btn.small{padding:3px 9px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.progress{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tab{border:0;background:transparent;padding:9px 14px;cursor:pointer;border-bottom:3px solid transparent;font-weight:600;color:var(--muted);white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--gold)}
.tab .n{font-weight:500;font-size:12px;margin-left:6px;padding:1px 7px;border-radius:999px;background:var(--idle-soft)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:650;padding:2px 9px;border-radius:999px;white-space:nowrap}
.s-approved{background:var(--ok-soft);color:var(--ok)}
.s-awaiting_approval{background:var(--blue-soft);color:var(--blue)}
.s-failed,.s-missing{background:var(--bad-soft);color:var(--bad)}
.s-changes_requested,.s-stale{background:var(--warn-soft);color:var(--warn)}
.s-not_checked{background:var(--idle-soft);color:var(--idle)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:14px;margin-bottom:14px}
.card h3{margin:0;font-size:16px}
.cardhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.cardhead .sp{flex:1}
.meta{font-size:12.5px;color:var(--muted)}
.meta code{font-size:12px}
.two{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px}
.compare{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-top:6px}
.take{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg)}
.take.chosen{border:2px solid var(--gold);background:var(--gold-soft)}
.take .score{font-size:30px;font-weight:800;line-height:1}
.take .score small{font-size:14px;font-weight:600;color:var(--muted)}
.take audio{width:100%;margin:8px 0}
.rules{width:100%;border-collapse:collapse;font-size:13px}
.rules td{padding:3px 4px;border-top:1px solid var(--line);vertical-align:top}
.rules .v{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.rules .ok{color:var(--ok);font-weight:700}.rules .no{color:var(--bad);font-weight:700}
.bars{display:flex;align-items:flex-end;gap:2px;height:46px;margin:8px 0 2px}
.bars span{flex:1;background:var(--blue);border-radius:2px 2px 0 0;opacity:.75}
.bars span.chorus{background:var(--saffron);opacity:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.imgwrap{position:relative;border-radius:8px;overflow:hidden;background:var(--idle-soft);user-select:none}
.imgwrap img{display:block;width:100%;height:auto;cursor:crosshair}
.imgwrap .box{position:absolute;border:2px solid var(--saffron);background:rgba(224,123,26,.12);pointer-events:none}
.imgwrap .box.old{border-style:dashed;border-color:var(--bad)}
.missing{padding:30px;text-align:center;color:var(--bad);font-weight:600}
.findings{list-style:none;padding:0;margin:8px 0;font-size:13.5px}
.findings li{display:flex;gap:8px;padding:3px 0;border-bottom:1px dashed var(--line)}
.findings li:last-child{border-bottom:0}
.findings .ic{width:18px;flex:none;text-align:center;font-weight:800}
.l-pass .ic{color:var(--ok)}.l-warn .ic{color:var(--warn)}.l-fail .ic{color:var(--bad)}.l-not_run .ic,.l-info .ic{color:var(--idle)}
.findings .ev{color:var(--muted);font-size:12.5px;display:block}
.prompt{font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;white-space:pre-wrap;max-height:9.5em;overflow:auto}
details.more summary{cursor:pointer;color:var(--blue);font-size:13px;margin:6px 0}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.thread{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.cmt{border-left:3px solid var(--line);padding:4px 0 4px 10px;margin:8px 0;font-size:13.5px}
.cmt.sev-critical{border-left-color:var(--bad)}.cmt.sev-major{border-left-color:var(--warn)}
.cmt .who{font-size:12px;color:var(--muted)}
.proposal{background:var(--gold-soft);border-radius:8px;padding:8px 10px;margin-top:6px}
form.cform{display:grid;gap:8px;margin-top:10px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
form.cform .row{display:flex;gap:8px;flex-wrap:wrap}
form.cform select,form.cform input,form.cform textarea{border:1px solid var(--line);border-radius:7px;padding:6px 8px;background:var(--panel)}
form.cform textarea{width:100%;min-height:64px;resize:vertical}
.hint{font-size:12.5px;color:var(--muted)}
audio{width:100%;margin:6px 0}
[hidden]{display:none!important}
canvas.wave{width:100%;height:70px;display:block;background:var(--bg);border-radius:8px;cursor:pointer}
.lyrics{white-space:pre-wrap;font-size:14px;max-height:520px;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px}
.seq{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.shot{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:12.5px}
.shot img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:var(--idle-soft)}
.shot img.mirror{transform:scaleX(-1)}
.shot .b{padding:6px 8px}
.shot .num{font-weight:800;color:var(--gold)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-weight:600;z-index:50;max-width:90vw}
.offline{max-width:640px;margin:60px auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px}
.offline code{background:var(--bg);padding:2px 6px;border-radius:5px}
.agent{background:var(--blue-soft);border-radius:8px;padding:6px 10px;font-size:13px;margin-top:6px}
@media (max-width:860px){.layout{grid-template-columns:1fr}aside{position:static;height:auto;max-height:46vh}.two{grid-template-columns:1fr}main{padding:12px 16px 60px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top">
  <h1>🪔 Nepali Rhyme Hub <span>· pre-video review</span></h1>
  <div class="sp"></div>
  <span class="meta" id="conn">connecting…</span>
  <button class="btn small" id="theme" title="Light / dark">◐</button>
</header>
<div class="layout" id="app">
  <aside>
    <input id="q" placeholder="Search bhajans…" autocomplete="off">
    <div class="filters" id="filters"></div>
    <div id="songs"></div>
  </aside>
  <main id="main"><div class="empty">Pick a bhajan on the left.</div></main>
</div>
<script>
"use strict";
const S = {songs: [], song: null, data: null, tab: "audio", filter: "all", sceneFilter: "all", form: null};
const LEVEL_IC = {pass: "✓", warn: "!", fail: "✗", not_run: "◌", info: "i"};
const STATE_TXT = {approved: "Approved", awaiting_approval: "Awaiting your approval", failed: "Failed checks",
  missing: "Missing", changes_requested: "Changes requested", stale: "Stale: changed since approval", not_checked: "Not checked"};
function getTabs() {
  const list = [
    ["audio", "1 · Music & lyrics"],
    ["character", "2 · Character"],
    ["scenes", "3 · Scenes"],
    ["storyboard", "4 · Storyboard"],
    ["seo", "5 · SEO & Thumbnails (A/B) 🖼️"]
  ];
  if (S.data && S.data.videos && S.data.videos.length > 0) {
    list.push(["videos", `6 · Generated Videos 🎬 (${S.data.videos.length})`]);
  } else if (S.tab === "videos") {
    list.push(["videos", "6 · Generated Videos 🎬"]);
  }
  list.push(["comments", "Comments & fixes"]);
  return list;
}

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const $ = sel => document.querySelector(sel);
const clock = t => t == null ? "" : `${Math.floor(t / 60)}:${(t % 60).toFixed(1).padStart(4, "0")}`;
const media = f => `/media/${encodeURIComponent(S.song)}/${f.split("/").map(encodeURIComponent).join("/")}`;
function toast(msg, ms = 2600) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.append(t); setTimeout(() => t.remove(), ms);
}
async function api(path, body) {
  const opt = body === undefined ? {} : {method: "POST", headers: {"Content-Type": "application/json", "X-Review": "1"}, body: JSON.stringify(body)};
  const r = await fetch(path, opt);
  const data = await r.json().catch(() => ({error: r.statusText}));
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}

/* ---------------- theme */
(() => {
  let saved = null; try { saved = localStorage.getItem("gk-theme"); } catch (e) {}
  if (saved) document.documentElement.dataset.theme = saved;
  $("#theme").onclick = () => {
    const dark = matchMedia("(prefers-color-scheme: dark)").matches;
    const cur = document.documentElement.dataset.theme || (dark ? "dark" : "light");
    const next = cur === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem("gk-theme", next); } catch (e) {}
  };
})();

/* ---------------- song list */
function songDot(s) {
  if (s.gate === true) return "ok";
  if (s.failed || !s.has_plan || !s.has_music) return "bad";
  if (s.checked) return "warn";
  return "";
}
function songNote(s) {
  if (!s.has_music) return "no music";
  if (s.rendered) return "rendered";
  const tags = [];
  if (s.score10) tags.push("10/10");
  if (s.storyclips > 0) tags.push(`${s.storyclips} clips`);
  else if (s.stills > 0) tags.push(`${s.stills} stills`);
  if (s.gate === true) tags.push("ready");
  else if (s.failed) tags.push(`${s.failed} fail`);
  else if (s.checked) tags.push("to approve");
  else tags.push("not checked");
  return tags.join(" · ");
}
function renderSongs() {
  const q = $("#q").value.trim().toLowerCase();
  const F = [
    ["all", "All"],
    ["score10", "Score 10 🏆"],
    ["storyboard", "Storyboard 🖼️"],
    ["storyclips", "Storyclips 🎬"],
    ["rendered", "Rendered 🎥"],
    ["ready", "Gate ready"],
    ["todo", "To review"]
  ];
  $("#filters").innerHTML = F.map(([k, t]) => `<button class="chipbtn ${S.filter === k ? "on" : ""}" data-f="${k}">${t}</button>`).join("");
  const list = S.songs.filter(s => {
    if (!q) return true;
    if (s.slug.toLowerCase().includes(q)) return true;
    if (q === "score10" && s.score10) return true;
    if (q === "storyboard" && (s.has_storyboard || s.stills > 0)) return true;
    if (q === "storyclips" && (s.has_storyclips || s.storyclips > 0)) return true;
    if (q === "rendered" && s.rendered) return true;
    return false;
  }).filter(s => {
    if (S.filter === "score10") return Boolean(s.score10);
    if (S.filter === "storyboard") return Boolean(s.has_storyboard || s.stills > 0);
    if (S.filter === "storyclips") return Boolean(s.has_storyclips || s.storyclips > 0);
    if (S.filter === "rendered") return Boolean(s.rendered);
    if (S.filter === "ready") return s.gate === true;
    if (S.filter === "todo") return !s.rendered && s.gate !== true;
    return true;
  });
  $("#songs").innerHTML = list.map(s => `<button class="song ${s.slug === S.song ? "sel" : ""}" data-s="${esc(s.slug)}">
      <span class="dot ${songDot(s)}"></span><span class="nm">${esc(s.slug)}${s.score10 ? ' <span class="score10-tag">10/10</span>' : ''}</span><span class="meta">${esc(songNote(s))}</span></button>`).join("")
    || `<div class="meta" style="padding:10px">No bhajan matches.</div>`;
}
$("#q").oninput = renderSongs;
$("#filters").onclick = e => { const f = e.target.dataset.f; if (f) { S.filter = f; renderSongs(); } };
$("#songs").onclick = e => { const b = e.target.closest("[data-s]"); if (b) openSong(b.dataset.s); };

async function openSong(slug, keepTab) {
  S.song = slug; S.form = null; if (!keepTab) S.tab = "audio";
  try { localStorage.setItem("gk-song", slug); } catch (e) {}
  history.replaceState(null, "", "#" + slug);
  renderSongs();
  $("#main").innerHTML = `<div class="empty">Loading ${esc(slug)}…</div>`;
  try { S.data = await api(`/api/song/${encodeURIComponent(slug)}`); }
  catch (e) { $("#main").innerHTML = `<div class="empty">Could not load: ${esc(e.message)}</div>`; return; }
  const row = S.songs.find(s => s.slug === slug); if (row) row.gate = S.data.gate.open;
  renderSongs(); renderSong();
}

/* ---------------- one song */
const assetsOf = sec => S.data.assets.filter(a => a.section === sec);
const asset = id => S.data.assets.find(a => a.id === id);
const commentsOf = id => S.data.comments.filter(c => c.asset === id);
function count(sec) {
  if (sec === "seo") return (S.data && S.data.seo && S.data.seo.has_ab) ? "A/B" : "SEO";
  if (sec === "videos") return (S.data && S.data.videos && S.data.videos.length > 0) ? `${S.data.videos.length}` : "0";
  const list = sec === "comments" ? S.data.comments.filter(c => !["resolved", "rejected"].includes(c.status)) : assetsOf(sec).filter(a => a.state !== "approved");
  return list.length;
}
function renderSong() {
  const d = S.data, g = d.gate, all = d.assets.length, ok = d.assets.filter(a => a.state === "approved").length;
  const states = {}; d.assets.forEach(a => states[a.state] = (states[a.state] || 0) + 1);
  const curTabs = getTabs();
  $("#main").innerHTML = `
    <div class="songhead"><h2>${esc(d.song)}</h2><span class="meta">take ${esc(d.take)}</span><div style="flex:1"></div>
      <button class="btn" id="recheck">↻ Run automated checks</button></div>
    <div class="gate ${g.open ? "open" : "closed"}"><div style="font-size:22px">${g.open ? "✅" : "⛔"}</div><div>
      <b>${g.open ? "Ready: video clips may be generated" : `Video generation is blocked: ${g.blockers.length} item(s) need attention`}</b>
      <span class="meta">${ok} of ${all} assets approved. Each one needs passed checks, your approval, and no change since.</span>
      ${g.open ? "" : `<details><summary>Show what is blocking</summary>${g.blockers.map(esc).join("<br>")}</details>`}</div></div>
    <div class="progress">${Object.entries(states).map(([k, n]) => `<span class="pill s-${k}">${n} ${esc(STATE_TXT[k] || k)}</span>`).join("")}</div>
    <div class="tabs">${curTabs.map(([k, t]) => `<button class="tab ${S.tab === k ? "on" : ""}" data-t="${k}">${t}<span class="n">${count(k)}</span></button>`).join("")}</div>
    <div id="pane"></div>`;
  $("#recheck").onclick = recheck;
  document.querySelector(".tabs").onclick = e => { const t = e.target.closest("[data-t]"); if (t) { S.tab = t.dataset.t; S.form = null; renderSong(); } };
  ({audio: paneAudio, character: paneCharacter, scenes: paneScenes, storyboard: paneStoryboard, seo: paneSeo, videos: paneVideos, comments: paneComments})[S.tab]();
}
async function recheck() {
  const b = $("#recheck"); b.disabled = true; b.textContent = "Checking…";
  try { S.data = await api(`/api/song/${encodeURIComponent(S.song)}/check`, {}); toast("Checks finished"); }
  catch (e) { toast("Checks failed: " + e.message); }
  const row = S.songs.find(s => s.slug === S.song);
  if (row) { row.checked = true; row.failed = S.data.assets.filter(a => a.check === "failed").length; row.gate = S.data.gate.open; }
  renderSongs(); renderSong();
}

/* ---------------- asset card */
function findingsHtml(a) {
  if (a.check === "not_checked") return `<p class="meta">Not checked for this version yet: press <b>Run automated checks</b>.</p>`;
  const order = {fail: 0, warn: 1, not_run: 2, info: 3, pass: 4};
  const list = [...a.findings].sort((x, y) => order[x.level] - order[y.level]);
  const notes = a.agent_notes.map(n => `<div class="agent">🤖 <b>${esc(n.by)}</b> (${esc(n.level)}): ${esc(n.message)} ${n.evidence ? `<span class="meta">${esc(n.evidence)}</span>` : ""}<br><span class="meta">AI note: information only, never an approval</span></div>`).join("");
  return `<ul class="findings">${list.map(f => `<li class="l-${f.level}"><span class="ic">${LEVEL_IC[f.level] || "·"}</span>

async function drawWave() {
  const btn = $("#wavebtn"), cv = $("#wave"), player = document.querySelector("audio[data-file]");
  btn.disabled = true; btn.textContent = "Reading the audio…";
  try {
    const buf = await (await fetch(player.src)).arrayBuffer();
    const audio = await new (window.AudioContext || window.webkitAudioContext)().decodeAudioData(buf);
    cv.hidden = false; const w = cv.width = cv.clientWidth * devicePixelRatio, h = cv.height = 70 * devicePixelRatio;
    const ctx = cv.getContext("2d"), data = audio.getChannelData(0), step = Math.ceil(data.length / w);
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--blue");
    for (let x = 0; x < w; x++) {
      let peak = 0; for (let i = x * step; i < (x + 1) * step && i < data.length; i += 8) peak = Math.max(peak, Math.abs(data[i]));
      if (peak > 0.995) ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--bad");
      ctx.fillRect(x, h / 2 - peak * h / 2, 1, Math.max(1, peak * h));
      ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--blue");
    }
    cv.onclick = e => { player.currentTime = (e.offsetX / cv.clientWidth) * audio.duration; player.play(); };
    btn.textContent = "Click the waveform to jump · red = at full scale";
  } catch (e) { btn.textContent = "Could not draw the waveform"; }
}

    <!-- Social Metadata & Copy Sections -->
    <h3 style="margin:24px 0 12px">📱 Social Media Packages & Copy</h3>
    <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(320px, 1fr));gap:16px">
      <!-- TikTok Card -->
      <div class="card">
        <div class="cardhead">
          <b>🎵 TikTok (Mandatory 30 Tags)</b>
          <div class="sp"></div>
          <button class="btn small ok" data-copy="tiktok">📋 Copy Caption</button>
        </div>
        <p class="meta" style="margin-bottom:6px">Rule-compliant: hook first, exactly 30 mandatory tags + niche tags.</p>
        <textarea id="tiktok_text" readonly style="width:100%;height:130px;font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px">${esc(seo.tiktok_txt || '')}</textarea>
      </div>

      <!-- Instagram Card -->
      <div class="card">
        <div class="cardhead">
          <b>📸 Instagram (Reels & Feed)</b>
          <div class="sp"></div>
          <button class="btn small ok" data-copy="insta">📋 Copy Caption</button>
        </div>
        <p class="meta" style="margin-bottom:6px">Aesthetic devotional copy + engagement question + 30-tag ladder.</p>
        <textarea id="insta_text" readonly style="width:100%;height:130px;font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px">${esc(seo.insta_txt || '')}</textarea>
      </div>

      <!-- Facebook Card -->
      <div class="card">
        <div class="cardhead">
          <b>👥 Facebook (Community Post)</b>
          <div class="sp"></div>
          <button class="btn small ok" data-copy="fb">📋 Copy Post</button>
        </div>
        <p class="meta" style="margin-bottom:6px">Parent discussion hook + video link prompt.</p>
        <textarea id="fb_text" readonly style="width:100%;height:130px;font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px">${esc(seo.fb_txt || '')}</textarea>
      </div>

      <!-- Bilibili Card -->
      <div class="card">
        <div class="cardhead">
          <b>📺 Bilibili (哔哩哔哩 16:9)</b>

          <button class="btn small ok" data-copy="bili">📋 Copy Info</button>
        </div>
        <p class="meta" style="margin-bottom:6px">Simplified Chinese ACG title, cultural synopsis & tags.</p>
        <textarea id="bili_text" readonly style="width:100%;height:130px;font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px">${esc(seo.bili_txt || '')}</textarea>

  `;

  document.querySelectorAll("[data-plat]").forEach(b => {
    b.onclick = () => {
      currentPlatform = b.dataset.plat;
      paneSeo();
    };
  });

  document.querySelectorAll("[data-copy]").forEach(b => {
    b.onclick = () => {
      const type = b.dataset.copy;
      const el = document.getElementById(type + "_text");
      if (el && el.value) {
        navigator.clipboard.writeText(el.value);
        toast(`Copied ${type.toUpperCase()} text to clipboard!`);

  const genBtn = $("#genThumbsBtn");
  if (genBtn) {

      try {
        await api(`/api/song/${encodeURIComponent(S.song)}/render_thumbnails`, {});

        openSong(S.song, true);
      } catch (err) {
        toast("Rendering launched in background: refresh in a few seconds.");
      }
    };
  }
}

/* ---------------- generated videos tab */
function paneVideos() {
  const d = S.data;
  const vids = d.videos || [];
  if (!vids.length) {
    $("#pane").innerHTML = `
      <div class="card" style="padding:32px;text-align:center;">
        <div style="font-size:46px;margin-bottom:12px;">⏳</div>
        <h3 style="margin:0 0 8px 0;font-size:18px;">No Videos Generated Yet for ${esc(d.song)}</h3>
        <p class="meta" style="max-width:540px;margin:0 auto 16px;line-height:1.5;">
          Full music videos and hook cuts are rendered in the final pipeline stage once storyboard stills and scene prompts are completed and approved.
        </p>
        <div style="display:inline-flex;gap:14px;background:var(--bg);padding:10px 18px;border-radius:8px;border:1px solid var(--line);font-size:13px;align-items:center;">
          <span>Storyboard Stills: <b>${(d.assets || []).filter(a => a.section === "storyboard" && a.files.length).length}</b> ready</span>
          <span>·</span>
          <span>Gate status: <b>${d.gate && d.gate.open ? "✅ Open for rendering" : "⛔ Checks in progress"}</b></span>
        </div>
      </div>`;
    return;
  }

  if (S.selectedVideoIdx == null || S.selectedVideoIdx >= vids.length) {
    S.selectedVideoIdx = vids.findIndex(v => v.is_primary);
    if (S.selectedVideoIdx < 0) S.selectedVideoIdx = 0;
  }
  const cur = vids[S.selectedVideoIdx];

  $("#pane").innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px;">
      <div>
        <h3 style="margin:0;display:flex;align-items:center;gap:8px;">
          🎬 Generated Video Player & Library
          <span class="pill" style="background:#2563eb;color:#fff;font-size:11px;">${vids.length} Available</span>
        </h3>
        <span class="meta">Full-length animation cuts, clean masters, and vertical/social hook videos ready to review & publish.</span>
      </div>
      <div style="display:flex;gap:8px;">
        <a href="${cur.url}" download="${esc(cur.filename)}" class="btn" style="text-decoration:none;">⬇ Download MP4 (${cur.size_mb} MB)</a>
        <a href="${cur.url}" target="_blank" class="btn" style="text-decoration:none;">↗ Open in Tab</a>
      </div>
    </div>

    <!-- Active Video Player -->
    <div class="card" style="padding:0;overflow:hidden;background:#000;margin-bottom:20px;">
      <video id="main-vid-player" controls playsinline preload="metadata" style="width:100%;max-height:580px;display:block;background:#000;" src="${cur.url}">
        Your browser does not support HTML5 video.
      </video>
      <div style="padding:14px 18px;display:flex;align-items:center;justify-content:space-between;background:var(--panel);border-top:1px solid var(--line);flex-wrap:wrap;gap:10px;">
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
          <b>${esc(cur.label)}</b>
          <span class="pill" style="background:${cur.has_logo ? '#059669' : '#4b5563'};color:#fff;font-size:11px;">${cur.has_logo ? '★ BRAND LOGO' : 'CLEAN MASTER'}</span>
          <span class="pill" style="background:#3b82f6;color:#fff;font-size:11px;">ENGINE: ${esc(cur.generator.toUpperCase())}</span>
          <span class="meta">${cur.size_mb} MB · <code>${esc(cur.filename)}</code></span>
        </div>
        <div class="meta" style="font-size:12px;">Rendered: ${esc(cur.mtime)}</div>
      </div>
    </div>

    <!-- Video Selector Cards -->
    <div style="margin-bottom:14px;">
      <h4 style="margin:0 0 10px 0;font-size:15px;">Choose Video Version to Preview:</h4>
      <div style="display:grid;grid-template-columns:repeat(auto-fill, minmax(290px, 1fr));gap:12px;">
        ${vids.map((v, idx) => `
          <div class="card vid-select-card" style="margin:0;padding:12px;cursor:pointer;border:${idx === S.selectedVideoIdx ? '2px solid var(--gold)' : '1px solid var(--line)'};background:${idx === S.selectedVideoIdx ? 'var(--gold-soft)' : 'var(--panel)'};border-radius:10px;transition:all 0.15s;" data-vidx="${idx}">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
              <span class="pill" style="background:${v.kind === 'full' ? '#2563eb' : '#7c3aed'};color:#fff;font-size:10px;">${v.kind === 'full' ? 'FULL VIDEO' : 'HOOK CUT'}</span>
              ${v.has_logo ? '<span class="pill" style="background:#059669;color:#fff;font-size:10px;">LOGO</span>' : '<span class="pill" style="background:#6b7280;color:#fff;font-size:10px;">CLEAN</span>'}

            <div class="meta" style="font-size:11px;margin-bottom:10px;">${esc(v.label)}</div>
            <button class="btn small ${idx === S.selectedVideoIdx ? 'ok' : ''}" style="width:100%;pointer-events:none;">
              ${idx === S.selectedVideoIdx ? '▶ Currently Playing' : '▶ Switch to this Video'}

        `).join("")}
      </div>
    </div>
  `;

  document.querySelectorAll(".vid-select-card").forEach(el => {
    el.onclick = () => {
      S.selectedVideoIdx = parseInt(el.dataset.vidx, 10);
      paneVideos();
    };
  });

/* ---------------- events */
document.addEventListener("click", async e => {
  const t = e.target.closest("button"); if (!t || !S.data) return;
  const song = encodeURIComponent(S.song);
  try {
    if (t.dataset.approve) {
      const a = asset(t.dataset.approve);
      if (a.findings.some(f => f.level === "warn") && !confirm("This version has warnings. Approve it anyway?")) return;
      await api(`/api/song/${song}/decision`, {asset: a.id, decision: "approved", version: a.version});
      toast("Approved"); return openSong(S.song, true);
    }
    if (t.dataset.changes || t.dataset.comment) {
      const id = t.dataset.changes || t.dataset.comment;
      S.form = {asset: id, kind: t.dataset.changes ? "changes" : "comment", region: null};
      ({audio: paneAudio, character: paneCharacter, scenes: paneScenes, storyboard: paneStoryboard})[S.tab]();
      const f = document.querySelector(`form[data-asset="${CSS.escape(id)}"] textarea`); if (f) f.focus();
      return;
    }
    if (t.hasAttribute("data-cancel")) { S.form = null; return renderSong(); }
    if (t.hasAttribute("data-now")) {
      const p = document.querySelector("audio[data-file]"); const inp = t.closest("form").querySelector("[name=at_time]");
      if (p && inp) inp.value = p.currentTime.toFixed(1); return;
    }
    if (t.dataset.cs) {
      await api(`/api/song/${song}/comment-status`, {comment: t.dataset.c, status: t.dataset.cs});
      toast({accepted: "Fix accepted: the agent regenerates on its next run", open: "Back to open", resolved: "Resolved"}[t.dataset.cs] || "Saved");
      return openSong(S.song, true);
    }
    if (t.dataset.restore) {
      if (!confirm(`Put ${t.dataset.v} back as ${t.dataset.restore}? The current file is kept as a version.`)) return;
      S.data = await api(`/api/song/${song}/restore`, {file: t.dataset.restore, version: t.dataset.v});
      toast("Restored: it needs checks and approval again"); return renderSong();
    }
  } catch (err) { toast(err.message, 4500); if (/changed since/.test(err.message)) openSong(S.song, true); }
});
document.addEventListener("submit", async e => {
  const f = e.target.closest("form.cform"); if (!f) return; e.preventDefault();
  const a = asset(f.dataset.asset), v = Object.fromEntries(new FormData(f));
  const body = {asset: a.id, version: a.version, text: v.text, category: v.category, severity: v.severity, suggestion: v.suggestion || "",
    at_time: v.at_time || null, region: S.form && S.form.region || null};
  if (v.prompt !== undefined && v.prompt.trim() !== (a.prompt || "").trim()) body.prompt = v.prompt;
  try {
    await api(`/api/song/${encodeURIComponent(S.song)}/comment`, body);
    if (S.form.kind === "changes") await api(`/api/song/${encodeURIComponent(S.song)}/decision`, {asset: a.id, decision: "changes_requested", version: a.version, note: v.text.slice(0, 200)});
    toast(body.prompt ? "Saved: your prompt edit is queued for the agent" : "Saved: the agent will propose a fix next run");
    S.form = null; openSong(S.song, true);
  } catch (err) { toast(err.message, 4500); }
});
/* drag a box on a picture to mark the problem area */
let drag = null;
document.addEventListener("mousedown", e => {
  const w = e.target.closest("[data-draw]"); if (!w || !S.form || S.form.asset !== w.dataset.draw) return;
  e.preventDefault(); const r = w.getBoundingClientRect();
  drag = {w, r, x0: (e.clientX - r.left) / r.width, y0: (e.clientY - r.top) / r.height};
});
document.addEventListener("mousemove", e => {
  if (!drag) return; const {r, x0, y0} = drag;
  const x1 = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), y1 = Math.min(1, Math.max(0, (e.clientY - r.top) / r.height));
  S.form.region = {x: Math.min(x0, x1), y: Math.min(y0, y1), w: Math.abs(x1 - x0), h: Math.abs(y1 - y0)};
  let b = drag.w.querySelector(".box:not(.old)"); if (!b) { b = document.createElement("div"); b.className = "box"; drag.w.append(b); }
  b.setAttribute("style", boxStyle(S.form.region));
});
document.addEventListener("mouseup", () => { if (drag && S.form.region && S.form.region.w < 0.01) S.form.region = null; drag = null; });

/* ---------------- start */
async function start() {
  if (location.protocol === "file:") {
    document.querySelector("#app").outerHTML = `<div class="offline"><h2>Start the review server first</h2>
      <p>This page saves your comments and approvals into each bhajan's <code>review</code> folder, so it needs its small local server.</p>
      <p>Double-click <code>nepalirhymehub\\pipeline_server.bat</code>, or run:</p>
      <p><code>cd D:\\claude_project\\subu-os</code><br><code>python -m subu.musicvideo review serve --port 8767 --channel nepali-rhyme-hub</code></p>
      <p>then open <a href="http://127.0.0.1:8767/">http://127.0.0.1:8767/</a></p></div>`;
    $("#conn").textContent = "offline"; return;
  }
  try { S.songs = await api("/api/songs"); $("#conn").textContent = `${S.songs.length} bhajans`; }
  catch (e) { $("#conn").textContent = "server not reachable"; return; }
  renderSongs();
  let last = decodeURIComponent(location.hash.slice(1)); if (!last) { try { last = localStorage.getItem("gk-song") || ""; } catch (e) {} }
  if (S.songs.some(s => s.slug === last)) openSong(last);
}
start();
</script>
